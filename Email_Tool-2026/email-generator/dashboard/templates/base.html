<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Login{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <style>
        /* Increase text size for the navbar links */
        .navbar-nav .nav-link {
            font-size: 1.25rem; /* 20px */
        }

        /* Increase text size for the navbar brand */
        .navbar-brand {
            font-size: 1.5rem; /* 24px */
        }

        /* Increase text size for content inside the container */
        .container {
            font-size: 1.125rem; /* 18px */
        }

        /* Adjust text size for buttons */
        .btn {
            font-size: 1rem; /* 16px */
        }

        {% block style %} {% endblock %}
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light px-4 py-2" style="background-color: #2F3645;">
        <a class="navbar-brand text-white" href="/">Email Generator</a>
        <button style="background-color: rgba(255, 255, 255, 0.5);" class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        {% if user.is_authenticated %}
        <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
            <ul class="navbar-nav">
                <li class="nav-item me-4">
                    <a class="nav-link {% if request.path == '/' %} text-white active {% else %} text-white-50 {% endif %}" href="/">Home</a>
                </li>
                <li class="nav-item me-4">
                    <a class="nav-link {% if request.path == '/upload-sheet' %} text-white active {% else %} text-white-50 {% endif %}" href="/upload-sheet">Upload Sheet</a>
                </li>
                <li class="nav-item me-4">
                    <a class="nav-link {% if request.path == '/missing-data' %} text-white active {% else %} text-white-50 {% endif %}" href="/missing-data">Missing Data</a>
                </li>
                <li class="nav-item">
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link nav-link text-white-50">
                            Logout
                        </button>
                    </form>                
                </li>
            </ul>
        </div>
        {% endif %}
    </nav>
    
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS and dependencies (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
